<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 540" width="1000" height="540"
     role="img"
     aria-label="Patent VQA 구조도 — 왼쪽에 특허 도면 이미지와 메타데이터 (입력), 오른쪽 대시 프레임 GEN 안에 설명문과 QA (한 호출에서 설명문을 쓰면서 이어서 QA 생성).">
<title>Patent VQA — 구조도</title>
<desc>특허 도면 이미지와 메타데이터를 입력받아 하나의 Gen 호출 안에서 설명문을 쓰면서 이어서 QA 를 만든다.</desc>

<defs>
  <style>
    :root {
      --ink:#141414;
      --sec:#4e4e4c;
      --faint:#8b8b86;
      --line:#a8a8a2;
      --hair:#d8d6ce;
      --accent:#2f5f95;
      --accent-soft:#e3ecf5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink:#f2f0e9;
        --sec:#b6b6b0;
        --faint:#7a7a75;
        --line:#4a4a44;
        --hair:#2a2a26;
        --accent:#82ade0;
        --accent-soft:#1d2d40;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text',
                        system-ui, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
           letter-spacing: -0.006em; fill: var(--ink); }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, monospace; }

    /* 헤더 · 라벨 */
    .h-col     { font-size: 12.5px; font-weight: 700; letter-spacing: 0.16em;
                 text-transform: uppercase; fill: var(--ink); }
    .h-col-a   { fill: var(--accent); }
    .h-sub     { font-size: 11.5px; font-weight: 600; letter-spacing: 0.12em;
                 fill: var(--faint); text-transform: uppercase; }
    .h-mini    { font-size: 11px; font-weight: 600; letter-spacing: 0.16em;
                 text-transform: uppercase; fill: var(--faint); }
    .ref-num   { font-size: 13px; font-weight: 700; fill: var(--ink); }

    /* 본문 스켈레톤 라인 */
    .body-line       { stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round;
                       opacity: 0.88; }
    .body-line-weak  { stroke: var(--sec); stroke-width: 2.2; stroke-linecap: round;
                       opacity: 0.5; }

    /* 프레임 · 기술 도면 요소 */
    .frame     { fill: none; stroke: var(--ink); stroke-width: 2.2; }
    .frame-in  { fill: none; stroke: var(--accent); stroke-width: 1.8; }
    .cross     { stroke: var(--ink); stroke-width: 1.8; }
    .leader    { stroke: var(--ink); stroke-width: 1.4; fill: none; }
    .rule-hair { stroke: var(--hair); stroke-width: 1.2; }
    .accent-line { stroke: var(--accent); stroke-width: 3; }

    /* Q, A 태그 */
    .qa-tag    { font-family: ui-monospace, 'SF Mono', Menlo, monospace;
                 font-size: 14px; font-weight: 700; fill: var(--ink); }

    /* 화살표 · 흐름선 */
    .arrow-line{ stroke: var(--ink); stroke-width: 1.8; fill: none;
                 stroke-linecap: round; stroke-linejoin: round; }
    .arrow-mini{ stroke: var(--sec); stroke-width: 1.6; fill: none;
                 stroke-linecap: round; stroke-linejoin: round; }

    /* 메타데이터 chip */
    .chip-line { stroke: var(--sec); stroke-width: 1.8; fill: none;
                 stroke-linecap: round; opacity: 0.55; }
    .chip-lbl  { font-size: 12.5px; font-weight: 600; fill: var(--sec);
                 letter-spacing: -0.002em; }

    /* Gen 컨테이너 */
    .gen-frame { fill: none; stroke: var(--ink); stroke-width: 1.8;
                 stroke-dasharray: 8 6; }
    .gen-tag   { font-family: ui-monospace, 'SF Mono', Menlo, monospace;
                 font-size: 12.5px; font-weight: 700; letter-spacing: 0.14em;
                 fill: var(--ink); }
    .gen-note  { font-size: 12px; font-weight: 600; letter-spacing: -0.002em;
                 fill: var(--sec); }
  </style>

  <!-- 대각 해칭 -->
  <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"
           patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="10"
          stroke="var(--faint)" stroke-opacity="0.55" stroke-width="0.7"/>
  </pattern>
</defs>

<!-- ═════════════════════════════════════════════════════════════════
     [ 상단 컬럼 헤더 ]
   ═════════════════════════════════════════════════════════════════ -->

<text class="h-col" x="60"  y="60">특허 도면 이미지 + 메타데이터</text>
<text class="h-col" x="546" y="60">GEN · 한 호출에서 이어서 생성</text>

<!-- ═════════════════════════════════════════════════════════════════
     [ 왼쪽 컬럼 · 입력 : 도면 + 메타데이터 ]
   ═════════════════════════════════════════════════════════════════ -->

<!-- (1) 도면 -->
<rect class="frame" x="60" y="86" width="290" height="184" fill="url(#hatch)"/>
<rect class="frame-in" x="90" y="106" width="230" height="144"/>
<circle class="frame" cx="205" cy="178" r="26"/>
<line class="cross" x1="179" y1="178" x2="231" y2="178"/>
<line class="cross" x1="205" y1="152" x2="205" y2="204"/>
<line class="leader" x1="234" y1="178" x2="360" y2="178"/>
<text class="mono ref-num" x="366" y="182">110</text>
<circle fill="var(--ink)" cx="290" cy="228" r="2.6"/>
<line class="leader" x1="291" y1="228" x2="360" y2="228"/>
<text class="mono ref-num" x="366" y="232">112</text>

<!-- (2) 메타데이터 -->
<text class="h-mini" x="60" y="306">METADATA</text>

<g transform="translate(60, 324)">
  <text class="chip-lbl" x="0" y="16">청구항</text>
  <line class="chip-line" x1="86" y1="12" x2="290" y2="12"/>

  <text class="chip-lbl" x="0" y="46">발명 명칭</text>
  <line class="chip-line" x1="86" y1="42" x2="270" y2="42"/>

  <text class="chip-lbl" x="0" y="76">IPC 분류</text>
  <line class="chip-line" x1="86" y1="72" x2="220" y2="72"/>

  <text class="chip-lbl" x="0" y="106">참조부호</text>
  <line class="chip-line" x1="86" y1="102" x2="256" y2="102"/>
</g>

<text class="h-sub" x="60" y="464">도면 1점 + 메타데이터 4항목</text>

<!-- ═════════════════════════════════════════════════════════════════
     [ 입력 → GEN 컨테이너 진입 화살표 ]
   ═════════════════════════════════════════════════════════════════ -->

<line class="arrow-line" x1="410" y1="250" x2="530" y2="250"/>
<path class="arrow-line" d="M 522 244 L 530 250 L 522 256"/>

<!-- ═════════════════════════════════════════════════════════════════
     [ 오른쪽 · GEN 대시 컨테이너 (설명문 → 이어서 → QA) ]
   ═════════════════════════════════════════════════════════════════ -->

<!-- 컨테이너 프레임 -->
<rect class="gen-frame" x="540" y="88" width="418" height="402" rx="10"/>

<!-- 컨테이너 헤더 -->
<text class="gen-tag"  x="560" y="118">GEN</text>
<text class="gen-note" x="600" y="118">설명문을 쓰면서 이어서 QA 를 생성</text>
<line class="rule-hair" x1="558" y1="130" x2="940" y2="130"/>

<!-- (A) 설명문 : 2-3 줄 스켈레톤 -->
<text class="h-sub" x="560" y="158">설명문</text>

<line class="body-line"      x1="560" y1="184" x2="900" y2="184"/>
<line class="body-line"      x1="560" y1="208" x2="880" y2="208"/>
<line class="body-line-weak" x1="560" y1="232" x2="800" y2="232"/>

<text class="h-mini" x="560" y="264">도면에만 근거</text>

<!-- (B) 이어서 -->
<line class="arrow-mini" x1="560" y1="298" x2="940" y2="298" stroke-dasharray="5 4"/>
<text class="gen-note" x="750" y="290" text-anchor="middle">↓ 이어서</text>

<!-- (C) QA -->
<text class="h-sub h-col-a" x="560" y="330">QA</text>

<line class="accent-line" x1="560" y1="352" x2="560" y2="472"/>

<text class="qa-tag" x="580" y="368">Q</text>
<line class="body-line"      x1="608" y1="364" x2="900" y2="364"/>
<line class="body-line"      x1="608" y1="384" x2="864" y2="384"/>
<line class="body-line-weak" x1="608" y1="404" x2="800" y2="404"/>

<text class="qa-tag" x="580" y="446">A</text>
<line class="body-line"      x1="608" y1="442" x2="900" y2="442"/>
<line class="body-line"      x1="608" y1="462" x2="880" y2="462"/>

</svg>
