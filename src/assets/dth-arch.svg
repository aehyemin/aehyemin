<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 468" role="img"
  aria-label="하네스 구조 — 왼쪽 자연어 요구사항이 data-tool-harness 컨테이너로 들어가고, 컨테이너 안에서 specs(요구사항 문서) → app/generated(생성된 도구 코드) → runtime+doctor(실행 확인·규칙 검사) → deploy.py(내부 플랫폼 배포)로 이어진다. 위쪽 docs/DESIGN.md 규칙층이 전 단계에 적용되고, 아래쪽 app/services(인증·저장소·DB 공통)와 reference(동시 잠금·DB 스키마·저장소)가 코드 작성에 쓰인다. 결과는 오른쪽 사내 권한 포털로 외부 검수자에게 노출된다.">
  <defs>
    <style>
      :root {
        --surface:#FFFFFF;
        --ink:#111111;
        --sec:#4B4F58;
        --faint:#828997;
        --line:#D8DBE3;
        --accent:var(--pc);
        --accent-ink:var(--pct);
        --accent-soft:#EFEBFF;
        --accent-line:#C9BDFF;
      }
      text { font-family:'Archivo','Noto Sans KR',system-ui,sans-serif; fill:var(--ink) }
      .mono { font-family:'IBM Plex Mono','Noto Sans KR',ui-monospace,monospace }
    </style>
    <filter id="cshadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0b0f18" flood-opacity="0.10"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" style="fill:var(--faint)"/>
    </marker>
    <marker id="ara" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" style="fill:var(--accent)"/>
    </marker>
  </defs>

  <!-- 컨테이너 -->
  <rect x="212" y="26" width="826" height="418" rx="22" style="fill:none;stroke:var(--line)" stroke-width="1.4"/>
  <text class="mono" x="236" y="55" font-size="12.5" letter-spacing="1" style="fill:var(--faint)">DATA-TOOL-HARNESS</text>

  <!-- 규칙층 (docs / DESIGN.md) -->
  <rect x="248" y="72" width="744" height="42" rx="12" style="fill:none;stroke:var(--line)" stroke-width="1.3" stroke-dasharray="4 5"/>
  <text x="620" y="98.5" text-anchor="middle" font-size="13">
    <tspan class="mono" style="fill:var(--ink)">docs / DESIGN.md</tspan><tspan style="fill:var(--sec)" dx="12">설계 규칙과 화면 룩을 전 단계에 적용</tspan>
  </text>
  <path d="M534 114 V152" fill="none" style="stroke:var(--faint)" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- 파이프라인 카드 (02~05) -->
  <g filter="url(#cshadow)">
    <rect x="250" y="158" width="168" height="104" rx="14" style="fill:var(--surface);stroke:var(--line)" stroke-width="1.3"/>
    <rect x="450" y="158" width="168" height="104" rx="14" style="fill:var(--surface);stroke:var(--line)" stroke-width="1.3"/>
    <rect x="650" y="158" width="168" height="104" rx="14" style="fill:var(--surface);stroke:var(--line)" stroke-width="1.3"/>
    <rect x="850" y="158" width="168" height="104" rx="14" style="fill:var(--surface);stroke:var(--line)" stroke-width="1.3"/>
  </g>
  <!-- 파이프라인 화살표 -->
  <g fill="none" style="stroke:var(--faint)" stroke-width="1.5">
    <path d="M420 210 H448" marker-end="url(#ar)"/>
    <path d="M620 210 H648" marker-end="url(#ar)"/>
    <path d="M820 210 H848" marker-end="url(#ar)"/>
  </g>

  <!-- 파이프라인 텍스트 -->
  <g class="mono" font-size="10.5" text-anchor="middle" style="fill:var(--faint)" letter-spacing="0.5">
    <text x="334" y="186">02</text><text x="534" y="186">03</text><text x="734" y="186">04</text><text x="934" y="186">05</text>
  </g>
  <g class="mono" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--ink)">
    <text x="334" y="212">specs</text><text x="534" y="212">app/generated</text>
    <text x="734" y="212">runtime + doctor</text><text x="934" y="212">deploy.py</text>
  </g>
  <g font-size="12" text-anchor="middle" style="fill:var(--sec)">
    <text x="334" y="234">요구사항 문서</text><text x="534" y="234">생성된 도구 코드</text>
    <text x="734" y="234">실행 확인, 규칙 검사</text><text x="934" y="234">내부 플랫폼 배포</text>
  </g>

  <!-- 공통 인프라 카드 -->
  <g filter="url(#cshadow)">
    <rect x="450" y="298" width="196" height="92" rx="14" style="fill:var(--surface);stroke:var(--line)" stroke-width="1.3"/>
    <rect x="690" y="298" width="216" height="92" rx="14" style="fill:var(--surface);stroke:var(--line)" stroke-width="1.3"/>
  </g>
  <g class="mono" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--ink)">
    <text x="548" y="338">app/services</text><text x="798" y="338">reference</text>
  </g>
  <g font-size="12" text-anchor="middle" style="fill:var(--sec)">
    <text x="548" y="360">인증, 저장소, DB 공통</text><text x="798" y="360">동시 잠금, DB 스키마, 저장소</text>
  </g>
  <!-- 인프라 → 파이프라인 -->
  <path d="M534 296 V264" fill="none" style="stroke:var(--faint)" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="544" y="284" font-size="11" style="fill:var(--faint)">가져다 씀</text>
  <path d="M798 296 V286 Q798 278 790 278 H742 Q734 278 734 270 V264"
        fill="none" style="stroke:var(--faint)" stroke-width="1.4"
        stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/>
  <text x="808" y="282" font-size="11" style="fill:var(--faint)">코드 작성 시 참고</text>

  <!-- 외부 노드 : 01 자연어 요구사항 -->
  <g filter="url(#cshadow)">
    <rect x="22" y="162" width="150" height="96" rx="14" style="fill:var(--surface);stroke:var(--line)" stroke-width="1.3"/>
  </g>
  <text class="mono" x="97" y="192" text-anchor="middle" font-size="10.5" style="fill:var(--faint)" letter-spacing="0.5">01</text>
  <text x="97" y="216" text-anchor="middle" font-size="15" font-weight="600" style="fill:var(--ink)">자연어 요구사항</text>
  <text x="97" y="236" text-anchor="middle" font-size="12" style="fill:var(--sec)">도구를 말로 설명</text>
  <path d="M172 210 H210" fill="none" style="stroke:var(--faint)" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 외부 노드 : 06 사내 권한 포털 (강조) -->
  <g filter="url(#cshadow)">
    <rect x="1078" y="162" width="150" height="96" rx="14" style="fill:var(--accent-soft);stroke:var(--accent-line)" stroke-width="1.5"/>
  </g>
  <text class="mono" x="1153" y="192" text-anchor="middle" font-size="10.5" style="fill:var(--accent-ink)" letter-spacing="0.5">06</text>
  <text x="1153" y="216" text-anchor="middle" font-size="15" font-weight="600" style="fill:var(--accent-ink)">사내 권한 포털</text>
  <text x="1153" y="236" text-anchor="middle" font-size="12" style="fill:var(--accent-ink)" opacity="0.85">외부 검수자 노출</text>
  <path d="M1038 210 H1076" fill="none" style="stroke:var(--accent)" stroke-width="1.6" marker-end="url(#ara)"/>
</svg>
