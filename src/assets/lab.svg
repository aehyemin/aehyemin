<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 420 132" width="420" height="132"
     role="img"
     aria-label="Korean Legal Agent Benchmark 엠블럼 — 왼쪽 질문 카드, 가운데 두 접시가 비대칭인 저울(무도구 대 도구 조건), 오른쪽 항목마다 0 또는 1로 매기는 채점표 카드.">
<title>Korean Legal Agent Benchmark</title>
<desc>질문만 주고(왼쪽) 도구를 쓴 조건과 쓰지 않은 조건을 견주어(가운데 저울) 쟁점별 채점표로 항목마다 0/1을 매긴다(오른쪽). 사내 도구 하네스·Patent VQA 와 통일된 팔레트를 따랐다.</desc>

<defs>
  <style>
    /* 라이트 · 다크 자동 대응 — 포트폴리오 공통 토큰 */
    :root {
      --surface:#ffffff;
      --ink:#1d1d1f;
      --sec:#6e6e73;
      --faint:#a1a1a6;
      --line:#d8d8dd;
      --accent:#3057a6;
      --accent-soft:#e8eef8;
      --accent-line:#a9bde0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface:#1c1c1e;
        --ink:#f5f5f7;
        --sec:#98989d;
        --faint:#6b6b70;
        --line:#33333a;
        --accent:#8fb0e6;
        --accent-soft:#1b2740;
        --accent-line:#33507f;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text',
                        system-ui, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
           letter-spacing: -0.006em; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, monospace; }

    .card    { fill: var(--surface); stroke: var(--line); stroke-width: 1.4; }
    .hairline{ stroke: var(--line); stroke-width: 1.1; fill: none; }
    .fill-line-strong { fill: var(--faint); opacity: 0.85; }
    .fill-line-weak   { fill: var(--faint); opacity: 0.5; }
    .arrow   { stroke: var(--faint); stroke-width: 1.7; fill: none; stroke-linecap: round; }

    /* 저울 — 법. 두 접시를 비대칭으로 둬 두 조건의 대조를 나타낸다 */
    .beam    { stroke: var(--ink); stroke-width: 2.6; fill: none;
               stroke-linecap: round; }
    .hang    { stroke: var(--ink); stroke-width: 1.5; fill: none; }
    .pan-off { fill: none; stroke: var(--ink); stroke-width: 2; }
    .pan-on  { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.2; }

    .tick-on { fill: var(--accent); }
    .tick-off{ fill: none; stroke: var(--faint); stroke-width: 1.3; }
    .tag-mono { font-size: 9px; font-weight: 500; letter-spacing: 0.14em;
                text-transform: uppercase; fill: var(--faint); }
    .digit   { font-size: 10.5px; font-weight: 700; fill: var(--ink); }
  </style>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0b0f18" flood-opacity="0.10"/>
  </filter>
</defs>

<!-- ═════════════════════════════════════════════════════════════════
     대칭 · 균일 간격 (모든 gap 10px, 화살표 10px)
     · Q 카드 (x=16-112) → 10px → 화살표 → 10px → pan-off 왼쪽 테두리 (x=142)
     · pan-on 오른쪽 테두리 (x=287) → 10px → 화살표 → 10px → 0/1 카드 (x=316)
     · 저울 중심 x=214 (viewBox 중심 x=210 근사) 로 두 pan 이 대칭
   ═════════════════════════════════════════════════════════════════ -->

<!-- ① 질문 카드 -->
<g filter="url(#soft)">
  <rect class="card" x="16" y="16" width="96" height="88" rx="11"/>
</g>
<line class="hairline" x1="16" y1="40" x2="112" y2="40"/>
<text class="mono digit" x="28" y="33">Q</text>
<rect class="fill-line-strong" x="28" y="54" width="72" height="4.5" rx="2.25"/>
<rect class="fill-line-strong" x="28" y="66" width="64" height="4.5" rx="2.25"/>
<rect class="fill-line-weak"   x="28" y="78" width="44" height="4.5" rx="2.25"/>

<!-- ①→② 왼쪽 화살표 : 카드 gap 10 · 선 10 · pan gap 10 -->
<path class="arrow" d="M122 60 H132"/>
<path class="arrow" d="M127 55.5 L132 60 L127 64.5"/>

<!-- ② 저울 — pan-off (cx=156) 와 pan-on (cx=272) 이 저울 중심 x=214 로 대칭 -->
<path class="beam" d="M156 40 H272"/>
<path class="beam" d="M214 40 V92"/>
<path class="beam" d="M196 92 H232"/>
<path class="hang" d="M156 40 V46"/>
<path class="hang" d="M272 40 V46"/>
<circle class="pan-off" cx="156" cy="60" r="14"/>
<circle class="pan-on"  cx="272" cy="60" r="14"/>

<!-- ②→③ 오른쪽 화살표 : pan gap 10 · 선 10 · 카드 gap 10 (왼쪽과 대칭) -->
<path class="arrow" d="M296 60 H306"/>
<path class="arrow" d="M301 55.5 L306 60 L301 64.5"/>

<!-- ③ 채점표 — 항목마다 0 또는 1 -->
<g filter="url(#soft)">
  <rect class="card" x="316" y="16" width="88" height="88" rx="11"/>
</g>
<line class="hairline" x1="316" y1="40" x2="404" y2="40"/>
<text class="mono digit" x="328" y="33">0/1</text>
<g>
  <rect class="tick-on"  x="328" y="52" width="8" height="8" rx="2"/>
  <rect class="fill-line-strong" x="344" y="54.5" width="46" height="3.5" rx="1.75"/>
  <rect class="tick-on"  x="328" y="68" width="8" height="8" rx="2"/>
  <rect class="fill-line-strong" x="344" y="70.5" width="38" height="3.5" rx="1.75"/>
  <rect class="tick-off" x="328.65" y="84.65" width="6.7" height="6.7" rx="1.6"/>
  <rect class="fill-line-weak" x="344" y="86.5" width="30" height="3.5" rx="1.75"/>
</g>

<!-- 단계 라벨 (저울 중심 라벨은 x=214 로 pan 중심에 맞춤) -->
<text class="tag-mono" x="16"  y="124">Question</text>
<text class="tag-mono" x="214" y="124" text-anchor="middle">No-tool / Tool</text>
<text class="tag-mono" x="404" y="124" text-anchor="end">Rubric</text>
</svg>
